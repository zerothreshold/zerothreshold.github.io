<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Threshold Labs</title>
<meta name="description" content="Zero Threshold Labs builds open-source tools for automation and security.">
<meta name="theme-color" content="#050506">
<link rel="icon" href="ztlabs-logo/ztl-mark-200-blackbackground@1x.png">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root {
    --bg: #050506;
    --ink: #F4F4F5;
    --ink-2: #B5B5B5;   /* the grey the wordmark uses for LABS */
    --ink-3: #6E6E73;
    --mark-w: clamp(270px, 52vw, 585px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  main {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 6vh 24px;
  }
  .hero {
    display: grid;
    justify-items: center;
    text-align: center;
    width: 100%;
  }
  .mark {
    width: var(--mark-w);
    height: auto;
    display: block;
  }
  .wordmark {
    width: calc(var(--mark-w) * 0.64);
    height: auto;
    display: block;
    margin-top: calc(var(--mark-w) * 0.018);
    color: var(--ink);
  }
  .wordmark .labs { fill: var(--ink-2); }
  .tagline {
    margin: clamp(28px, 5vh, 44px) 0 0;
    max-width: 30ch;
    font-size: clamp(15px, 1.05vw + 10px, 17px);
    line-height: 1.5;
    font-weight: 400;
    color: var(--ink-2);
    letter-spacing: 0.005em;
    text-wrap: balance;
  }
  .github {
    margin-top: clamp(20px, 3vh, 28px);
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    text-decoration: none;
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
    transition: color 600ms ease, border-color 600ms ease;
  }
  .github:hover { color: var(--ink); border-color: var(--ink-3); }
  .github:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; border-radius: 1px; }

  /* Motion. Runs only with JS present and reduced-motion off. */
  /* A glowing head flies the figure-eight; each pixel flares as it passes.
     The script sets --d per pixel from where it sits on the path. */
  .mark .head { pointer-events: none; }
  .js .mark rect {
    opacity: 0;
    transform-box: fill-box;
    transform-origin: center;
  }
  .js .mark.go rect {
    animation: ignite 700ms cubic-bezier(.2,.7,.2,1) var(--d) forwards;
  }
  .js .mark.go rect.c {
    animation: ignite 700ms cubic-bezier(.2,.7,.2,1) var(--d) forwards,
               breathe 9s ease-in-out calc(2600ms + var(--p)) infinite;
  }
  .js .wordmark, .js .tagline, .js .github {
    opacity: 0;
    animation: rise 1100ms cubic-bezier(.2,.65,.2,1) forwards;
  }
  .js .wordmark { animation-delay: 1700ms; }
  .js .tagline  { animation-delay: 2050ms; }
  .js .github   { animation-delay: 2350ms; }

  @keyframes ignite {
    0%   { opacity: 0; transform: scale(.3); }
    10%  { opacity: 1; transform: scale(1.8); }
    100% { opacity: 1; transform: none; }
  }
  @keyframes rise   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
  }
  @media (prefers-reduced-motion: reduce) {
    .js .mark rect, .js .mark rect.c, .js .wordmark, .js .tagline, .js .github {
      animation: none; opacity: 1; transform: none;
    }
    .github { transition: none; }
    .mark .head { display: none; }
  }
  @media (max-width: 480px) {
    :root { --mark-w: 84vw; }
    .wordmark { width: calc(var(--mark-w) * 0.71); }
  }
</style>

<script>
(() => {
  const mark = document.querySelector('.mark');
  if (!mark || matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const NS = 'http://www.w3.org/2000/svg';

  // A lemniscate of Bernoulli fitted over the two rings. s counts laps:
  // s = 0 is the centre crossing, heading up into the right loop.
  const CX = 439, CY = 232, A = 262, SY = 1.08;
  const at = s => {
    const t = s * 2 * Math.PI - Math.PI / 2, sn = Math.sin(t), c = Math.cos(t), k = 1 + sn * sn;
    return [CX + A * c / k, CY + SY * A * sn * c / k];
  };

  // The head eases in, whips through one full lap, then coasts on into a
  // partial second lap while it fades, so the motion follows through.
  const LAPS = 1.3, T = 2000, START = 150;
  const lapsAt = u => LAPS * (1 - Math.cos(Math.PI * u)) / 2;
  const timeAt = s => Math.acos(1 - 2 * s / LAPS) / Math.PI * T;

  // Each pixel lights when the head reaches the nearest point on the path.
  const N = 720, path = [];
  for (let i = 0; i < N; i++) path.push(at(i / N));
  for (const r of mark.querySelectorAll('rect')) {
    const x = +r.getAttribute('x') + r.getAttribute('width') / 2;
    const y = +r.getAttribute('y') + r.getAttribute('height') / 2;
    let best = 0, bd = Infinity;
    for (let i = 0; i < N; i++) {
      const dx = path[i][0] - x, dy = path[i][1] - y, d = dx * dx + dy * dy;
      if (d < bd) { bd = d; best = i; }
    }
    // Stray pixels far off the band (the dissolving edge) scatter a little later.
    const jitter = Math.random() * (bd > 2500 ? 220 : 50);
    r.style.setProperty('--d', Math.round(START - 30 + timeAt(best / N) + jitter) + 'ms');
  }

  // The head: a bright core trailed by fading glows, each a few ms behind.
  mark.insertAdjacentHTML('beforeend',
    '<defs><radialGradient id="glow"><stop offset="0" stop-color="#fff"/>' +
    '<stop offset=".35" stop-color="#bff7ff" stop-opacity=".7"/>' +
    '<stop offset="1" stop-color="#00E5FF" stop-opacity="0"/></radialGradient></defs>');
  const head = document.createElementNS(NS, 'g');
  head.setAttribute('class', 'head');
  const TRAIL = 16, LAG = 13, dots = [];
  for (let k = TRAIL - 1; k >= 0; k--) {
    const c = document.createElementNS(NS, 'circle');
    c.setAttribute('r', 30 * (1 - k / TRAIL * 0.75));
    c.setAttribute('fill', 'url(#glow)');
    c.setAttribute('opacity', (1 - k / TRAIL) ** 1.6);
    head.appendChild(c);
    dots[k] = c;
  }
  head.style.opacity = 0;
  mark.appendChild(head);

  requestAnimationFrame(t0 => {
    mark.classList.add('go');
    const frame = now => {
      const ms = now - t0 - START;
      if (ms > T) { head.remove(); return; }
      const u = ms / T;
      head.style.opacity = Math.min(1, Math.max(0, ms / 120), (1 - u) / 0.3);
      dots.forEach((c, k) => {
        const [x, y] = at(lapsAt(Math.max(0, ms - k * LAG) / T));
        c.setAttribute('cx', x.toFixed(1));
        c.setAttribute('cy', y.toFixed(1));
      });
      requestAnimationFrame(frame);
    };
    requestAnimationFrame(frame);
  });
})();
</script>
</body>
</html>
