<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zero Threshold Labs</title>
<meta name="description" content="Zero Threshold Labs builds open-source tools for automation and security.">
<meta name="theme-color" content="#050506">
<link rel="icon" href="ztlabs-logo/ztl-mark-200-blackbackground@1x.png">
<script>document.documentElement.classList.add('js')</script>
<style>
  :root {
    --bg: #050506;
    --ink: #F4F4F5;
    --ink-2: #B5B5B5;   /* the grey the wordmark uses for LABS */
    --ink-3: #6E6E73;
    --mark-w: clamp(270px, 52vw, 585px);
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  main {
    min-height: 100svh;
    display: grid;
    place-items: center;
    padding: 6vh 24px;
  }
  .hero {
    display: grid;
    justify-items: center;
    text-align: center;
    width: 100%;
  }
  .mark {
    width: var(--mark-w);
    height: auto;
    display: block;
  }
  .wordmark {
    width: calc(var(--mark-w) * 0.64);
    height: auto;
    display: block;
    margin-top: calc(var(--mark-w) * 0.018);
    color: var(--ink);
  }
  .wordmark .labs { fill: var(--ink-2); }
  .tagline {
    margin: clamp(28px, 5vh, 44px) 0 0;
    max-width: 30ch;
    font-size: clamp(15px, 1.05vw + 10px, 17px);
    line-height: 1.5;
    font-weight: 400;
    color: var(--ink-2);
    letter-spacing: 0.005em;
    text-wrap: balance;
  }
  .github {
    margin-top: clamp(20px, 3vh, 28px);
    font-size: 13px;
    letter-spacing: 0.08em;
    color: var(--ink-3);
    text-decoration: none;
    padding: 6px 2px;
    border-bottom: 1px solid transparent;
    transition: color 600ms ease, border-color 600ms ease;
  }
  .github:hover { color: var(--ink); border-color: var(--ink-3); }
  .github:focus-visible { outline: 1px solid var(--ink); outline-offset: 6px; border-radius: 1px; }

  /* Motion. Runs only with JS present and reduced-motion off. */
  .js .mark rect {
    opacity: 0;
    transform: translateY(-5px);
    animation: settle 1250ms cubic-bezier(.2,.65,.2,1) calc(var(--d) * .8) forwards;
  }
  .js .mark rect.c {
    animation: settle 1250ms cubic-bezier(.2,.65,.2,1) calc(var(--d) * .8) forwards,
               breathe 9s ease-in-out calc(3100ms + var(--p)) infinite;
  }
  .js .wordmark, .js .tagline, .js .github {
    opacity: 0;
    animation: rise 1500ms cubic-bezier(.2,.65,.2,1) forwards;
  }
  .js .wordmark { animation-delay: 2100ms; }
  .js .tagline  { animation-delay: 2700ms; }
  .js .github   { animation-delay: 3200ms; }

  @keyframes settle { to { opacity: 1; transform: none; } }
  @keyframes rise   { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @keyframes breathe {
    0%, 100% { opacity: 1; }
    50% { opacity: .45; }
  }
  @media (prefers-reduced-motion: reduce) {
    .js .mark rect, .js .mark rect.c, .js .wordmark, .js .tagline, .js .github {
      animation: none; opacity: 1; transform: none;
    }
    .github { transition: none; }
  }
  @media (max-width: 480px) {
    :root { --mark-w: 84vw; }
    .wordmark { width: calc(var(--mark-w) * 0.71); }
  }
</style>
